apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp3-frontend
  labels:
    app: mp3-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mp3-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: mp3-frontend
    spec:
      containers:
        - name: mp3-frontend
          # Replace with your built React frontend image (commonly nginx-based)
          image: jaironberiguete/mp3-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              name: http
          env:
            - name: REACT_APP_API_BASE_URL
              value: "https://api.example.com" # adjust as needed or use a ConfigMap/Secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-conf
          configMap:
            name: mp3-frontend-nginx-conf
      # imagePullSecrets:
      #   - name: my-registry-secret
