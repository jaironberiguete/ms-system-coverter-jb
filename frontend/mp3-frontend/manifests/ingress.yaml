apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mp3-frontend-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"   # change to letsencrypt-prod for production
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # optional: add security headers or other nginx ingress annotations here
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - frontend.example.com        # <-- replace with your domain
      secretName: mp3-frontend-tls
  rules:
    - host: frontend.example.com      # <-- replace with your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mp3-frontend
                port:
                  number: 80
